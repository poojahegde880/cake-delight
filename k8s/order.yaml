
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: cake-delight
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: cake-delight-frontend-order-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002

          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: cake-delight-config
                  key: ORDER_PORT

            - name: MONGO_URI
              valueFrom:
                configMapKeyRef:
                  name: cake-delight-config
                  key: MONGO_URI_ORDER

            - name: CATALOG_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: cake-delight-config
                  key: CATALOG_SERVICE_URL

            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: RABBITMQ_DEFAULT_USER

            - name: RABBITMQ_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: RABBITMQ_DEFAULT_PASS

          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: cake-delight
spec:
  selector:
    app: order-service
  ports:
    - port: 8002
      targetPort: 8002
  type: ClusterIP
