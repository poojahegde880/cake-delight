
apiVersion: v1
kind: ConfigMap

metadata:
  name: cake-delight-config
  namespace: cake-delight

data:
  CATALOG_PORT: "8001"
  ORDER_PORT: "8002"
  RATING_PORT: "8003"
  NOTIFICATION_PORT: "8004"
  GATEWAY_PORT: "8080"

  MONGO_URI_CATALOG: "mongodb://mongo:27017/cake_catalog"
  MONGO_URI_ORDER: "mongodb://mongo:27017/cake_orders"
  MONGO_URI_RATING: "mongodb://mongo:27017/cake_ratings"
  MONGO_URI_NOTIFICATION: "mongodb://mongo:27017/cake_notifications"

  RABBITMQ_URL: "amqp://rabbitmq:5672"

  CATALOG_SERVICE_URL: "http://catalog-service:8001"
  ORDER_SERVICE_URL: "http://order-service:8002"
  RATING_SERVICE_URL: "http://rating-service:8003"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8004"
