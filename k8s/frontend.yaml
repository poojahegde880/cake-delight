
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cake-delight-frontend
  namespace: cake-delight
  labels:
    app: cake-delight-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cake-delight-frontend
  template:
    metadata:
      labels:
        app: cake-delight-frontend
    spec:
      containers:
        - name: frontend
          image: cake-delight-frontend-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: cake-delight-frontend
  namespace: cake-delight
spec:
  type: NodePort
  selector:
    app: cake-delight-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
